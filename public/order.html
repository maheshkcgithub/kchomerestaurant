<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your order</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/customer.css">
</head>
<body class="customer">
  <header><h1 id="title">Your order</h1><a href="/">Menu</a></header>
  <main>
    <div id="content"><p class="muted">Loading…</p></div>
    <p class="muted">Keep this page (or bookmark it) to follow your order. It updates automatically.</p>
  </main>

  <script src="/static/common.js"></script>
  <script>
    const code = location.pathname.split('/').pop();
    const messages = {
      Received: 'We have received your order and are preparing it.',
      Ready: 'Your order is ready!',
      Cancelled: 'Sorry, this order was cancelled.',
    };

    async function load() {
      try {
        const o = await api('/api/orders/' + code);
        document.getElementById('title').textContent = o.restaurant;
        document.getElementById('content').innerHTML = `
          <div class="card">
            <div class="row">
              <h2 style="margin:0">Order #${o.id}</h2>
              <span class="badge ${o.status}">${o.status}</span>
            </div>
            <p>${messages[o.status]}</p>
            <p class="muted">${o.fulfilment === 'delivery' ? 'Delivery' : 'Pickup'} · ${fmtTime(o.requestedTime)}</p>
          </div>
          <div class="card">
            <table>
              ${o.items.map((i) => `<tr><td>${i.qty} × ${esc(i.name)}</td><td style="text-align:right">${kr(i.qty * i.price)}</td></tr>`).join('')}
            </table>
            <p><strong>Total: ${kr(o.total)}</strong></p>
          </div>
          ${o.status === 'Cancelled' ? '' : `
          <div class="card">
            <strong>Please pay ${kr(o.total)} by Swish to ${esc(o.swishNumber)}</strong>
            <div class="muted">Write "Order ${o.id}" in the message.</div>
          </div>`}`;
      } catch (e) {
        document.getElementById('content').innerHTML = `<p class="error">${esc(e.message)}</p>`;
      }
    }

    load();
    setInterval(load, 5000);
  </script>
</body>
</html>
