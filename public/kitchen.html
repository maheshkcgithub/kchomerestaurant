<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kitchen</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Kitchen</h1>
    <div class="actions" style="margin:0">
      <button class="secondary" id="soundBtn">🔇 Enable sound</button>
      <a href="/kitchen/menu">Edit menu</a>
    </div>
  </header>
  <main>
    <h2>Active orders</h2>
    <div id="active"><p class="muted">Loading…</p></div>

    <p style="margin-top:24px"><button class="secondary" id="finishedBtn">Show finished orders</button></p>
    <div id="finished" hidden></div>
  </main>

  <script src="/static/common.js"></script>
  <script>
    const NEXT = { New: 'Accepted', Accepted: 'Cooking', Cooking: 'Ready', Ready: 'Done' };
    let knownIds = null;          // order ids seen so far (null = first load)
    const highlight = new Set();  // new orders not yet touched
    let soundOn = false;
    let audioCtx;

    // Browsers only allow sound after a click on the page, so sound needs a button.
    document.getElementById('soundBtn').onclick = (e) => {
      soundOn = !soundOn;
      audioCtx ||= new AudioContext();
      e.target.textContent = soundOn ? '🔔 Sound on' : '🔇 Enable sound';
      if (soundOn) beep();
    };

    function beep() {
      if (!soundOn || !audioCtx) return;
      [0, 0.3].forEach((delay) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = 880;
        gain.gain.value = 0.2;
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + delay);
        osc.stop(audioCtx.currentTime + delay + 0.2);
      });
    }

    function orderCard(o, finished) {
      const next = NEXT[o.status];
      return `
        <div class="card ${highlight.has(o.id) ? 'new-order' : ''}">
          <div class="row">
            <div>
              <strong>#${o.id} · ${esc(o.customer_name)}</strong>
              <span class="badge ${o.status}">${o.status}</span>
              <span class="badge ${o.paid ? 'paid' : 'unpaid'}">${o.paid ? 'Paid' : 'Not paid'}</span>
            </div>
            <strong>${fmtTime(o.requested_time)}</strong>
          </div>
          <div class="muted">
            ${o.fulfilment === 'delivery' ? '🚗 Delivery: ' + esc(o.address) : '🏠 Pickup'} ·
            📞 <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a>
          </div>
          <ul>${o.items.map((i) => `<li>${i.qty} × ${esc(i.name)}</li>`).join('')}</ul>
          <div><strong>${kr(o.total)}</strong></div>
          <div class="actions">
            ${next ? `<button onclick="update(${o.id}, {status: '${next}'})">→ ${next}</button>` : ''}
            ${o.status === 'New' ? `<button class="secondary" onclick="confirmStatus(${o.id}, 'Rejected')">Reject</button>` : ''}
            ${!finished && o.status !== 'New' ? `<button class="secondary" onclick="confirmStatus(${o.id}, 'Cancelled')">Cancel</button>` : ''}
            <label style="margin:0;display:flex;align-items:center;gap:6px;font-weight:normal">
              <input type="checkbox" style="width:auto" ${o.paid ? 'checked' : ''} onchange="update(${o.id}, {paid: this.checked})"> Paid
            </label>
          </div>
        </div>`;
    }

    async function load() {
      try {
        const orders = await api('/kitchen/api/orders');
        const ids = orders.map((o) => o.id);
        if (knownIds) {
          const fresh = ids.filter((id) => !knownIds.has(id));
          fresh.forEach((id) => highlight.add(id));
          if (fresh.length) beep();
        } else {
          orders.filter((o) => o.status === 'New').forEach((o) => highlight.add(o.id));
        }
        knownIds = new Set([...(knownIds || []), ...ids]);
        document.getElementById('active').innerHTML =
          orders.length ? orders.map((o) => orderCard(o, false)).join('') : '<p class="muted">No active orders.</p>';
        document.title = orders.some((o) => o.status === 'New') ? '🔔 New order! · Kitchen' : 'Kitchen';
      } catch (e) {
        document.getElementById('active').innerHTML = `<p class="error">${esc(e.message)}</p>`;
      }
      if (!document.getElementById('finished').hidden) loadFinished();
    }

    async function loadFinished() {
      const orders = await api('/kitchen/api/orders?finished=1');
      document.getElementById('finished').innerHTML =
        orders.length ? orders.map((o) => orderCard(o, true)).join('') : '<p class="muted">None yet.</p>';
    }

    document.getElementById('finishedBtn').onclick = (e) => {
      const box = document.getElementById('finished');
      box.hidden = !box.hidden;
      e.target.textContent = box.hidden ? 'Show finished orders' : 'Hide finished orders';
      if (!box.hidden) loadFinished();
    };

    async function update(id, body) {
      highlight.delete(id);
      await api('/kitchen/api/orders/' + id, { method: 'PATCH', body }).catch((e) => alert(e.message));
      load();
    }

    function confirmStatus(id, status) {
      if (confirm(`Mark order #${id} as ${status}?`)) update(id, { status });
    }

    load();
    setInterval(load, 5000);
  </script>
</body>
</html>
