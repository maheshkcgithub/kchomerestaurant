<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kitchen</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Kitchen</h1>
    <div class="actions" style="margin:0">
      <button class="secondary" id="soundBtn">🔇 Enable sound</button>
      <a href="/kitchen/menu">Edit menu</a>
    </div>
  </header>
  <main>
    <nav class="tabs">
      <button data-view="received" class="active">Received <span id="activeCount"></span></button>
      <button data-view="ready">Ready</button>
      <button data-view="cancelled">Cancelled</button>
    </nav>
    <div id="orders"><p class="muted">Loading…</p></div>
  </main>

  <script src="/static/common.js"></script>
  <script>
    let knownIds = null;          // order ids seen so far (null = first load)
    const highlight = new Set();  // new orders not yet touched
    let soundOn = false;
    let audioCtx;

    // Browsers only allow sound after a click on the page, so sound needs a button.
    document.getElementById('soundBtn').onclick = (e) => {
      soundOn = !soundOn;
      audioCtx ||= new AudioContext();
      e.target.textContent = soundOn ? '🔔 Sound on' : '🔇 Enable sound';
      if (soundOn) beep();
    };

    function beep() {
      if (!soundOn || !audioCtx) return;
      [0, 0.3].forEach((delay) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = 880;
        gain.gain.value = 0.2;
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + delay);
        osc.stop(audioCtx.currentTime + delay + 0.2);
      });
    }

    function orderCard(o) {
      return `
        <div class="card ${highlight.has(o.id) ? 'new-order' : ''}">
          <div class="row">
            <div>
              <strong>#${o.id} · ${esc(o.customer_name)}</strong>
              <span class="badge ${o.status}">${o.status}</span>
            </div>
            <strong>${fmtTime(o.requested_time)}</strong>
          </div>
          <div class="muted">
            ${o.fulfilment === 'delivery' ? '🚗 Delivery: ' + esc(o.address) : '🏠 Pickup'}
            ${o.phone ? ` · 📞 <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a>` : ''}${o.email ? ` · ✉️ ${esc(o.email)}` : ''}
          </div>
          <ul>${o.items.map((i) => `<li>${i.qty} × ${esc(i.name)}</li>`).join('')}</ul>
          <div><strong>${kr(o.total)}</strong></div>
          ${o.status === 'Received' ? `
          <div class="actions">
            <button onclick="update(${o.id}, {status: 'Ready'})">✓ Ready</button>
            <button class="secondary" onclick="confirmStatus(${o.id}, 'Cancelled')">Cancel order</button>
          </div>` : ''}
        </div>`;
    }

    let view = 'received';
    const EMPTY = { received: 'No orders waiting.', ready: 'No ready orders yet.', cancelled: 'No cancelled orders.' };

    async function load() {
      const box = document.getElementById('orders');
      try {
        // Always check received orders, so new ones beep even while another tab is open.
        const active = await api('/kitchen/api/orders');
        const ids = active.map((o) => o.id);
        if (knownIds) {
          const fresh = ids.filter((id) => !knownIds.has(id));
          fresh.forEach((id) => highlight.add(id));
          if (fresh.length) beep();
        }
        knownIds = new Set([...(knownIds || []), ...ids]);
        const hasNew = active.some((o) => highlight.has(o.id));
        document.getElementById('activeCount').textContent = active.length ? `(${active.length})` : '';
        document.title = hasNew ? '🔔 New order! · Kitchen' : 'Kitchen';

        const orders = view === 'received' ? active : await api('/kitchen/api/orders?view=' + view);
        box.innerHTML = orders.length
          ? orders.map(orderCard).join('')
          : `<p class="muted">${EMPTY[view]}</p>`;
      } catch (e) {
        box.innerHTML = `<p class="error">${esc(e.message)}</p>`;
      }
    }

    document.querySelectorAll('.tabs button').forEach((btn) => {
      btn.onclick = () => {
        view = btn.dataset.view;
        document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('active', b === btn));
        document.getElementById('orders').innerHTML = '<p class="muted">Loading…</p>';
        load();
      };
    });

    async function update(id, body) {
      highlight.delete(id);
      await api('/kitchen/api/orders/' + id, { method: 'PATCH', body }).catch((e) => alert(e.message));
      load();
    }

    function confirmStatus(id, status) {
      if (confirm(`Cancel order #${id}? The customer gets an email if they gave one.`)) update(id, { status });
    }

    load();
    setInterval(load, 5000);
  </script>
</body>
</html>
